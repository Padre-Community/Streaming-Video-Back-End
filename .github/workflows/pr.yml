name: Pull Request Contribution [PRC]

on:
  push:
    branches: [ feature/** ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install -DskipTests

  unit-tests:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test

  integration-tests:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Integration Tests
        run: mvn verify

  codeql:
    needs: [ unit-tests, integration-tests ]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Set up JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Release O.S
        run: curl -fsSL https://raw.githubusercontent.com/ivancarlosantos/installer/refs/heads/master/release.sh | sh

      - name: Build with Maven (compile)
        run: mvn compile -DskipTests -B -e

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Notify Discord Success Deploy
        if: success()
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_id: ${{ secrets.WEBHOOK_ID }}
          webhook_token: ${{ secrets.WEBHOOK_TOKEN }}
          color: "#48f442"
          username: ${{ github.actor }}
          message: ":rocket: Send a new commit\n[Ver Commit] ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

      - name: Notify Discord Failure Deploy
        if: failure()
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_id: ${{ secrets.WEBHOOK_ID }}
          webhook_token: ${{ secrets.WEBHOOK_TOKEN }}
          color: "#b81d1d"
          username: ${{ github.actor }}
          message: ":triumph: Algo deu errado meu caro :triumph:\nRevise o que aconteceu e envie novamente"

  echo-info:
    name: Pipeline Summary Info
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print Execution Details
        run: |
          echo "============================================="
          echo " PIPELINE EXECUTION SUMMARY"
          echo "============================================="
          echo "Branch:           ${{ github.ref_name }}"
          echo "Triggered by:     ${{ github.actor }}"
          echo "Pipeline Status:  ${{ needs.arch-test.result == 'success' && 'SUCCESS' || 'FAILED' }}"
          echo "============================================="